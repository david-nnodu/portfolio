  <!-- Apply the saved NEPA (dark mode) choice before the page paints, so it never flashes the wrong theme -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('nepa'); } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'off' || (saved === null && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'night');
      }
    })();
  </script>
