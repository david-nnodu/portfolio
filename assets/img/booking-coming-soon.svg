<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="hatch" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="40" height="40" fill="#EDE5CF"/>
      <rect width="14" height="40" fill="#E3D8B9"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#hatch)"/>

  <!-- Booking sheet -->
  <rect x="268" y="138" width="1080" height="724" fill="#141414"/>
  <rect x="250" y="120" width="1080" height="724" fill="#FFFDF6" stroke="#141414" stroke-width="6"/>
  <rect x="250" y="120" width="1080" height="110" fill="#F2B705" stroke="#141414" stroke-width="6"/>
  <text x="300" y="192" font-family="'Courier New', monospace" font-weight="700" font-size="46" fill="#141414">BOOK A SLOT · BARBER</text>

  <!-- Scissors -->
  <g stroke="#141414" stroke-width="8" fill="none" stroke-linecap="round">
    <circle cx="1205" cy="196" r="17"/>
    <circle cx="1205" cy="154" r="17"/>
    <line x1="1220" y1="187" x2="1288" y2="150"/>
    <line x1="1220" y1="163" x2="1288" y2="200"/>
  </g>

  <!-- Day labels -->
  <g font-family="'Courier New', monospace" font-weight="700" font-size="30" fill="#5F5A4C">
    <text x="300" y="300">MON</text><text x="560" y="300">TUE</text><text x="820" y="300">WED</text><text x="1080" y="300">THU</text>
  </g>

  <!-- Time slots -->
  <g font-family="'Courier New', monospace" font-weight="700" font-size="34" fill="#141414">
    <g fill="none" stroke="#141414" stroke-width="4" stroke-dasharray="12 8">
      <rect x="300" y="330" width="210" height="80"/><rect x="560" y="330" width="210" height="80"/><rect x="1080" y="330" width="210" height="80"/>
      <rect x="300" y="440" width="210" height="80"/><rect x="820" y="440" width="210" height="80"/><rect x="1080" y="440" width="210" height="80"/>
      <rect x="560" y="550" width="210" height="80"/><rect x="820" y="550" width="210" height="80"/><rect x="1080" y="550" width="210" height="80"/>
      <rect x="300" y="660" width="210" height="80"/><rect x="560" y="660" width="210" height="80"/><rect x="820" y="660" width="210" height="80"/>
    </g>
    <text x="345" y="382">09:00</text><text x="605" y="382">09:00</text><text x="1125" y="382">09:00</text>
    <text x="345" y="492">11:00</text><text x="865" y="492">11:00</text><text x="1125" y="492">11:00</text>
    <text x="605" y="602">13:00</text><text x="865" y="602">13:00</text><text x="1125" y="602">13:00</text>
    <text x="345" y="712">15:00</text><text x="605" y="712">15:00</text><text x="865" y="712">15:00</text>

    <!-- The booked slots -->
    <rect x="820" y="330" width="210" height="80" fill="#141414"/>
    <text x="840" y="382" fill="#B9B3A2" font-size="28">TAKEN</text>
    <rect x="560" y="440" width="210" height="80" fill="#F2B705" stroke="#141414" stroke-width="5"/>
    <text x="580" y="492" font-size="30">BOOKED ✓</text>
    <rect x="300" y="550" width="210" height="80" fill="#141414"/>
    <text x="320" y="602" fill="#B9B3A2" font-size="28">TAKEN</text>
    <rect x="1080" y="660" width="210" height="80" fill="#141414"/>
    <text x="1100" y="712" fill="#B9B3A2" font-size="28">TAKEN</text>
  </g>

  <text x="300" y="808" font-family="'Courier New', monospace" font-size="28" fill="#5F5A4C">No queue. Pick a time, show up, get served.</text>

  <!-- Coming soon stamp -->
  <g transform="rotate(-8 1220 860)">
    <rect x="1010" y="800" width="420" height="110" fill="#141414"/>
    <text x="1220" y="872" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="46" fill="#F2B705">COMING SOON</text>
  </g>
</svg>
